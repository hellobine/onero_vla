[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lerobot_robot_onero"
version = "0.3.4"
description = "Standalone A1/H1 ROS 2 hardware plugin and offline LeRobot inference"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["lerobot==0.7.0", "pyyaml>=6.0.2,<7"]

[project.optional-dependencies]
pi = ["lerobot[pi]==0.7.0"]
smolvla = ["lerobot[smolvla]==0.7.0"]
diffusion = ["lerobot[diffusion]==0.7.0"]

[project.scripts]
onero-infer = "lerobot_robot_onero.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.14,<1"]

[tool.uv.sources]
lerobot = { path = "../lerobot", editable = true }

[tool.uv]
# The macOS CPU validation uses this supported upstream pair. GPU platforms resolve
# their own wheels; NVIDIA/Thor acceptance is independent of local CPU tests.
constraint-dependencies = [
  "torch==2.10.0; sys_platform == 'darwin'",
  "torchvision==0.25.0; sys_platform == 'darwin'",
  "cmake==4.1.3; sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_robot_onero"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
