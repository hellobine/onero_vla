[project]
name = "onero-openpi-jax-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jax[cuda13]==0.9.2",
  "flax==0.12.5",
  "orbax-checkpoint==0.11.33",
  "numpy==2.2.6",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==4.53.2",
  "augmax==0.3.4",
  "equinox==0.13.1",
  "einops>=0.8,<0.9",
  "beartype==0.19.0",
  "chex==0.1.90",
  "jaxtyping==0.2.36",
  "ml-collections==1.0.0",
  "numpydantic>=1.6.6,<2",
  "sentencepiece>=0.2,<0.3",
  "pillow>=11,<13",
  "opencv-python-headless>=4.10,<4.14",
  "fsspec[gcs]>=2024.6,<2027",
  "safetensors>=0.4,<1",
  "dm-tree>=0.1.8,<0.2",
  "typing-extensions>=4.12,<5",
  "tqdm-loggable>=0.2,<1",
  "rich>=14,<16",
  "requests>=2.32,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onero_jax_worker"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]


[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
